<!DOCTYPE html>
<html lang="en">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
<head>
    <title>Login/ SignUp Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
     <button class ="tab-button" onclick="ShowForm('login')">Home</button>
     <button class ="tab-button" onclick="ShowForm('signup')">Sign Up</button>
    </div>
    <div class="login-container">
    <!-- Login Form -->
    <h2>Login</h2>
    <form action="page2.html" method="post">
        <label for="username">Username or Email:</label>
        <input type="text" id="username or Email" name="username or Email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Login">
    </form>
    <!-- Sign Up Form -->
    <h2>Sign Up</h2>        
    <form action="page2.html" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <br><br>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        <input type="submit" value="Sign Up">
    </form>
    </div>
</body>   
</html>
