<!DOCTYPE html>
<html lang="en">
<head>
    <title>career.com</title>
</head>
<body>
    <header>
        <h1>Full Stack Developments course</h1>
        <p>Student Registration Form</p>
    </header>

    <h1>Created the Account </h1>
    <form action="page3.html" method="post">
        <label for="Full Name">Full Name:</label>
        <input type="text" id="Full Name" name="Full Name   " required>
        <br><br>
        <label for="emailid">Email id:</label>
        <input type="text" id="emailid" name="email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <br><br>
        <label for ="date of birth">Date of Birth:</label>
        <input type="date" id="date of birth" name="date of birth" required>
        <br><br>
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>      
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label>
        <br><br>
        <!--checkbox-->
        <p>Technical Skills:</p>
        <input type="checkbox" id="html" name="html" value="html">  
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="css" value="css">  
        <label for="css">CSS</label>    
        <input type="checkbox" id="javascript" name="javascript" value="javascript">  
        <label for="javascript">JavaScript</label>  
        <input type="checkbox" id="python" name="python" value="python">
        <label for="python">Python</label>
        <input type="checkbox" id="java" name="java" value="java">  
        <label for="java">Java</label>
        <br><br>
        <label for="country">Country:</label>
        <Select id="country" name="country" required>
            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="Germany">Germany</option>
        </Select>
        <br><br>
        <p>About Yourself:</p>
        <textarea id="About Yourself" name="About Yourself" rows="4" cols="50" required></textarea>
        <br><br>
        <input type="Register Now" value="Register Now">
        <input type="Clear Form" value="Clear Form">
        <footer>
            <p>&copy; 2026Full Stack Development Course. All rights reserved.</p>
        </footer>
    </form>  
</body>
</html>
